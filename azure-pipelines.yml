# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  name: Azure Pipelines

steps:
- script: |
    echo "Installing oc client..."
    curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
    tar -xvf openshift-client-linux.tar.gz
    sudo mv oc kubectl /usr/local/bin/
    oc version --client
  displayName: Install oc
- task: CmdLine@2
  inputs:
    script: 'oc login https://api.piomin.centralus.aroapp.io:6443 -u kubeadmin -p $(OCP_PASSWORD) --insecure-skip-tls-verify=true'
  displayName: Login to OpenShift
- task: CmdLine@2
  inputs:
    script: 'oc project apps-dev'
  displayName: Switch to project
- task: CmdLine@2
  inputs:
    script: 'oc process -f ocp/openshift.yaml -o yaml -p IMAGE_TAG=v1.0-$(Build.BuildId) -p NAMESPACE=apps-dev | oc apply -f -'
  displayName: Create build
- task: CmdLine@2
  inputs:
    script: 'oc start-build sample-spring-boot-web-bc -w'
    failOnStderr: true
  displayName: Start build
  timeoutInMinutes: 3
- task: CmdLine@2
  inputs:
    script: 'oc status'
  displayName: Check status







